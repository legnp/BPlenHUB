    ============================================================
    BPlen — Assinatura de E-mail (Padrao V01)
    Segue a mesma paleta de src/lib/emails/email-layout.ts:
    petroleo #044159 + ametista #9558A6/#9677D9. Nao usa o
    gradiente magenta/roxo do site publico — aquele e tratamento
    de landing page, este e correspondencia.

    REGRAS DE E-MAIL (nao sao as mesmas do kit de documentos)
    - So tabela com estilo inline. Sem <style>, sem classe, sem
      flex/grid — o Gmail descarta ao colar, e outros clientes
      (Outlook) nunca leram flex/grid de qualquer forma.
    - So fonte de sistema (Arial/Helvetica). Fonte customizada nao
      carrega em cliente de e-mail.
    - Logo por URL hospedada (nao base64). Confirmado ativo em
      https://www.bplen.com/logo_bplen/logo.png

    COMO GERAR A VERSAO DE UMA PESSOA
    1. Duplique este arquivo com o nome da pessoa.
    2. Troque os campos {{ENTRE CHAVES}}.
    3. Abra no navegador — nao no editor de codigo.
    4. Selecione tudo dentro do quadro pontilhado (Ctrl+A dentro
       dele, nao a pagina toda) e copie (Ctrl+C).
    5. Cole na configuracao de assinatura do Gmail.
    Detalhes completos: COMO-INSTALAR.md nesta pasta.
    ============================================================
  -->
